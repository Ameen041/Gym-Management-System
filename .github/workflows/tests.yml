# Runs on every pull request and on master: if anything here fails,
# GitHub shows a red cross on the pull request before it is merged.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      # the Docker image the site runs on uses 8.3; 8.4 is checked too, for the next move
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, zip
          coverage: none

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile every page template
        env:
          APP_KEY: base64:Eopz1sJP3E/ipJ/idGqUNrbvTEyU1IdTCShDCkr2fFY=
        run: php artisan view:cache

      - name: Check JavaScript syntax
        run: for f in public/js/*.js public/sw.js; do node --check "$f"; done

      - name: Run the tests
        run: vendor/bin/phpunit

  # The live server runs MySQL, which is stricter than SQLite (column sizes, JSON key order),
  # so the tests run on it too.
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: himma_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, fileinfo, zip
          coverage: none

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: himma_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  # The server kit (deploy/) end to end on a clean Ubuntu machine: the same setup.sh a new
  # server runs, the real image build, MySQL and Caddy, then the site over HTTPS.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Run setup.sh as on a new server
        run: |
          # a CI machine has no use for the firewall step
          sudo mv /usr/sbin/ufw /usr/sbin/ufw.off || true
          sudo DOMAIN=localhost ADMIN_EMAIL=admin@example.com ADMIN_PASSWORD='Test-password-123' bash deploy/setup.sh

      - name: The site answers over HTTPS
        run: |
          curl -fsSk https://localhost/ | grep -q 'Himma\|همّة'
          curl -fsSk -o /dev/null https://localhost/coaches
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308

      - name: himma backup works
        run: sudo himma backup && sudo ls /root/himma-backups | grep -q json.gz

      - name: Logs
        if: failure()
        run: sudo docker compose --project-directory deploy -f deploy/compose.yml logs --tail=200

  # The shared-hosting install (deploy/shared/) as on Hostinger: a normal user, MariaDB,
  # ~/domains/<domain>/public_html, then the site and the admin login, then an update.
  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: himma
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, zip
          coverage: none

      # Like Hostinger's shell: no /dev/fd (/proc hidden) and PHP without proc_open and friends
      - name: Run install.sh as on Hostinger
        run: |
          mkdir -p ~/domains/himma.test/public_html ~/hostinger-ini
          echo 'old page' > ~/domains/himma.test/public_html/index.html
          echo 'disable_functions = proc_open,popen,exec,shell_exec,system,passthru' > ~/hostinger-ini/hostinger.ini
          sudo unshare -m sh -c "mount -t tmpfs none /proc && exec runuser -u $USER -- env HOME=$HOME PATH=$PATH PHP_INI_SCAN_DIR=:$HOME/hostinger-ini \
            DOMAIN=himma.test DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=himma DB_USERNAME=root DB_PASSWORD=root \
            ADMIN_EMAIL=admin@example.com ADMIN_PASSWORD='Test-pa\$\$word1' bash deploy/shared/install.sh"

      - name: The site answers from public_html, and the admin can log in
        run: |
          test "$(readlink -f ~/domains/himma.test/public_html)" = "$PWD/public"
          test -f ~/domains/himma.test/public_html.before-himma/index.html
          (cd ~/domains/himma.test/public_html && php -S 127.0.0.1:8000 "$GITHUB_WORKSPACE/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php" >/dev/null 2>&1 &)
          sleep 2
          for p in / /coaches /terms; do test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$p")" = 200; done
          token="$(curl -s -c jar -b jar http://localhost:8000/ | grep -oE 'name="_token" value="[^"]+"' | head -1 | sed 's/.*value="//; s/"$//')"
          curl -s -c jar -b jar -o /dev/null --data-urlencode "_token=$token" --data-urlencode email=admin@example.com \
            --data-urlencode 'password=Test-pa$$word1' http://localhost:8000/login
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' http://localhost:8000/admin/system)" = 200

      - name: The nightly tasks run without proc_open
        run: |
          for task in app:backup app:check-in-reminders app:subscription-reminders; do
            PHP_INI_SCAN_DIR=":$HOME/hostinger-ini" php artisan schedule:test --name="$task" | grep -q DONE
          done
          ls storage/app/backups | grep -q json.gz

      - name: Running it again updates and keeps one scheduled task
        run: |
          PHP_INI_SCAN_DIR=":$HOME/hostinger-ini" bash deploy/shared/install.sh
          if command -v crontab >/dev/null; then test "$(crontab -l | grep -c 'artisan schedule:run')" = 1; fi
          test ! -f storage/framework/down
