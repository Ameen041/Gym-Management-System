# Runs on every pull request and on master: if anything here fails,
# GitHub shows a red cross on the pull request before it is merged.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # same PHP version as the Docker image the site runs on
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, zip
          coverage: none

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile every page template
        env:
          APP_KEY: base64:Eopz1sJP3E/ipJ/idGqUNrbvTEyU1IdTCShDCkr2fFY=
        run: php artisan view:cache

      - name: Check JavaScript syntax
        run: for f in public/js/*.js public/sw.js; do node --check "$f"; done

      - name: Run the tests
        run: vendor/bin/phpunit
