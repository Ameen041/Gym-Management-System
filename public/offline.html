<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0e">
  <title>Offline | Ameen Gym</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f8fc;color:#111827;text-align:center}
    .box{max-width:380px;background:#fff;border-radius:16px;padding:32px 24px;box-shadow:0 12px 30px rgba(17,24,39,.08)}
    img{width:88px;height:88px;border-radius:20px}
    h1{font-size:1.3rem;margin:16px 0 8px}
    p{color:rgba(0,0,0,.6);line-height:1.6;margin:0 0 6px}
    button{margin-top:16px;padding:10px 20px;border:0;border-radius:10px;background:#119c4b;color:#fff;font-weight:600;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="Ameen Gym">
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <p dir="rtl">لا يوجد اتصال بالإنترنت، تحقق من الاتصال وحاول مرة أخرى.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
