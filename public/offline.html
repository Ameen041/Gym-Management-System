<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0e">
  <title>لا يوجد اتصال | همّة</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f3f4f6;color:#0c0f13;text-align:center}
    .box{max-width:380px;background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 12px 30px rgba(12,15,19,.08)}
    img{width:88px;height:88px;border-radius:22px}
    h1{font-size:1.3rem;margin:16px 0 8px}
    p{color:#5d6570;line-height:1.7;margin:0 0 6px}
    button{margin-top:16px;padding:10px 22px;border:0;border-radius:12px;background:#119c4b;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
    @media (prefers-color-scheme: dark){ body{background:#090b0e;color:#f1f3f6} .box{background:#121519;box-shadow:none} p{color:#9aa2ad} }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="همّة">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الاتصال وحاول مرة أخرى.</p>
    <p dir="ltr" lang="en">You're offline. Check your connection and try again.</p>
    <button onclick="location.reload()">حاول مرة أخرى</button>
  </div>
</body>
</html>
